name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "assets/**"
      - ".github/workflows/ios-unsigned-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild \
            -project VuongQuocTuyet.xcodeproj \
            -scheme VuongQuocTuyet \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry vuong-quoc-tuyet-ios-v2.9-unsigned.ipa Payload
          shasum -a 256 vuong-quoc-tuyet-ios-v2.9-unsigned.ipa > vuong-quoc-tuyet-ios-v2.9-unsigned.ipa.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vuong-quoc-tuyet-ios-v2.9-unsigned
          path: |
            ios/vuong-quoc-tuyet-ios-v2.9-unsigned.ipa
            ios/vuong-quoc-tuyet-ios-v2.9-unsigned.ipa.sha256
      - name: Attach IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.9.0 >/dev/null 2>&1; then
            gh release create v2.9.0 --title "Vương quốc Tuyết v2.9.0" --notes-file RELEASE_NOTES.md || true
          fi
          gh release upload v2.9.0 \
            ios/vuong-quoc-tuyet-ios-v2.9-unsigned.ipa \
            ios/vuong-quoc-tuyet-ios-v2.9-unsigned.ipa.sha256 \
            --clobber

