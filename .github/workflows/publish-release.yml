name: Publish Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify APK
        run: |
          mkdir -p dist
          cat release/parts-v2.9.2/vuong-quoc-tuyet-v2.9.2.apk.part-* > dist/vuong-quoc-tuyet-v2.9.2.apk
          echo "8bdd7c73f9cd9f1c904a742a94708573e54e93a7ce5569ff69538e20650c6e8d  dist/vuong-quoc-tuyet-v2.9.2.apk" | sha256sum --check
      - name: Publish v2.9.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.9.2 >/dev/null 2>&1; then
            gh release create v2.9.2 --title "Vương quốc Tuyết v2.9.2" \
              --notes-file RELEASE_NOTES.md --latest || true
          fi
          gh release upload v2.9.2 dist/vuong-quoc-tuyet-v2.9.2.apk --clobber

