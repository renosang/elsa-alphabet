name: Publish Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify APK
        run: |
          mkdir -p dist
          cat release/parts-v2.9/vuong-quoc-tuyet-v2.9.apk.part-* > dist/vuong-quoc-tuyet-v2.9.apk
          echo "931205d0d4a953be671fde6de6f68d3b75c38865796ff6a425c07a7bde68fd75  dist/vuong-quoc-tuyet-v2.9.apk" | sha256sum --check
      - name: Publish v2.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.9.0 >/dev/null 2>&1; then
            gh release create v2.9.0 --title "Vương quốc Tuyết v2.9.0" \
              --notes-file RELEASE_NOTES.md --latest || true
          fi
          gh release upload v2.9.0 dist/vuong-quoc-tuyet-v2.9.apk --clobber

