name: VuongQuocTuyet
options:
  bundleIdPrefix: vn.vuongquoctuyet
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  VuongQuocTuyet:
    type: application
    platform: iOS
    sources:
      - path: VuongQuocTuyet
      - path: ../assets
        type: folder
        buildPhase: resources
    settings:
      base:
        # Explicit App ID from the user's ESign provisioning profile "44".
        # ESign did not rewrite the original identifier, so build it into the
        # app before signing to guarantee an entitlement/profile match.
        PRODUCT_BUNDLE_IDENTIFIER: A4.alexd.ios.beta
        # Keep the technical bundle/executable name ASCII for maximum
        # compatibility with third-party IPA signing tools. The name shown on
        # the home screen remains Vietnamese through CFBundleDisplayName.
        PRODUCT_NAME: VuongQuocTuyet
        PRODUCT_MODULE_NAME: VuongQuocTuyet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: 2.9.3
        CURRENT_PROJECT_VERSION: 22
    info:
      path: VuongQuocTuyet/Info.plist
      properties:
        CFBundleDisplayName: Vương quốc Tuyết
        CFBundleName: VuongQuocTuyet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: Lưu tranh của bé vào thư viện ảnh.
        UIAppFonts:
          - assets/fonts/nunito-medium.ttf
          - assets/fonts/nunito-bold.ttf

